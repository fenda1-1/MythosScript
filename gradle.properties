# Shared Gradle settings safe to commit.
# Put machine-specific Java home / trustStore / JVM args overrides in ~/.gradle/gradle.properties.
org.gradle.daemon=false
org.gradle.workers.max=2
# Do NOT add org.gradle.java.home here. This file is committed, so a
# machine-specific path would break every other machine (and every non-Windows
# one). Set JAVA_HOME instead — or JAVA8_HOME / JDK8_HOME, which gradlew.bat
# also honours. build.gradle locates a JDK 8 for ProGuard on its own.
